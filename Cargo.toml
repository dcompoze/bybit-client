[package]
name = "bybit-client"
version = "0.2.0"
edition = "2024"
authors = ["dcompoze"]
description = "A Rust client library for the Bybit V5 API with REST and WebSocket support"
license = "MIT"
repository = "https://github.com/dcompoze/bybit-client"
homepage = "https://github.com/dcompoze/bybit-client"
documentation = "https://docs.rs/bybit-client"
readme = "README.md"
keywords = ["bybit", "cryptocurrency", "trading", "api", "websocket"]
categories = ["api-bindings", "asynchronous", "web-programming"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"
name = "bybit_client"

[dependencies]
base64 = "0.22"
futures = "0.3.31"
futures-util = "0.3.31"
hex = "0.4"
reqwest = { version = "0.13.1", features = ["json"] }
ring = "0.17"
reqwest-middleware = "0.5.0"
reqwest-retry = "0.9.0"
reqwest-tracing = "0.7.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt", "macros"] }
tokio-stream = "0.1.18"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
dotenv = "0.15"
tokio = { version = "1.49", features = ["full"] }
tokio-test = "0.4"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
