[package]
authors = ["dcompoze"]
categories = ["api-bindings", "asynchronous", "web-programming"]
description = "A Rust client library for the Bybit V5 API with REST and WebSocket support"
documentation = "https://docs.rs/bybit-client"
edition = "2024"
homepage = "https://github.com/dcompoze/bybit-client"
keywords = ["bybit", "cryptocurrency", "trading", "api", "websocket"]
license = "MIT"
name = "bybit-client"
readme = "README.md"
repository = "https://github.com/dcompoze/bybit-client"
rust-version = "1.85"
version = "0.2.2"

[lib]
name = "bybit_client"
path = "src/lib.rs"

[package.metadata.docs.rs]
features = ["rustls-tls"]
no-default-features = true

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
rustls-tls = [
    "reqwest/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
]

[dependencies]
base64 = "0.22"
futures = "0.3.31"
futures-util = "0.3.31"
hex = "0.4"
reqwest = { version = "0.13.1", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "system-proxy",
] }
reqwest-middleware = "0.5.0"
reqwest-retry = "0.9.0"
reqwest-tracing = "0.7.1"
ring = "0.17"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt", "macros"] }
tokio-stream = "0.1.18"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tracing = "0.1.44"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
dotenv = "0.15"
tokio = { version = "1.49", features = ["full"] }
tokio-test = "0.4"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
